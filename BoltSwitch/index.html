<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Remote Switch</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0e14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Remote Switch">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0e14;
    --bg2: #0d1117;
    --border: #1e2d3d;
    --accent: #39c5f5;
    --green: #00e676;
    --green-dim: rgba(0,230,118,0.05);
    --green-border: #1a3d2a;
    --red: #ff3d3d;
    --red-dim: rgba(255,61,61,0.05);
    --red-border: #3d1a1a;
    --text: #b0bec5;
    --text-dim: #4a6278;
    --font: 'JetBrains Mono', 'Fira Mono', 'Cascadia Code', 'Courier New', monospace;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 0 12px 40px;
  }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .app { width: 100%; max-width: 680px; }

  /* Header */
  .header {
    display: flex; align-items: center; gap: 12px;
    padding: 18px 0 12px;
    border-bottom: 1px solid var(--border);
  }
  .logo svg { display: block; }
  .header-title { font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: .12em; text-transform: uppercase; }
  .header-sub { font-size: 10px; color: var(--text-dim); letter-spacing: .08em; margin-top: 2px; }
  .status { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px var(--green); }
  .status-dot.off { background: var(--red); box-shadow: 0 0 6px var(--red); }
  .status-label { font-size: 10px; color: var(--green); letter-spacing: .1em; }
  .status-label.off { color: var(--red); }
  .sync-btn {
    background: none; border: 1px solid var(--border); border-radius: 3px;
    color: var(--text-dim); font-size: 14px; cursor: pointer; padding: 1px 6px;
    transition: all .15s; line-height: 1;
  }
  .sync-btn:hover { border-color: var(--accent); color: var(--accent); }
  .sync-btn.spinning { animation: spin .8s linear infinite; color: var(--accent); border-color: var(--accent); }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  /* Tabs */
  .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  .tab-btn {
    padding: 10px 18px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    cursor: pointer; color: var(--text-dim); background: none; border: none;
    border-bottom: 2px solid transparent; font-family: var(--font);
    transition: color .15s; margin-bottom: -1px; outline: none;
  }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* Panels */
  .panel { display: none; flex-direction: column; gap: 8px; }
  .panel.active { display: flex; }

  /* Section label */
  .section-label {
    font-size: 10px; color: var(--text-dim); letter-spacing: .12em;
    text-transform: uppercase; margin: 14px 0 8px 2px;
  }

  /* Relay rows */
  .relay-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px;
    background: var(--red-dim); border: 1px solid var(--red-border);
    border-radius: 4px; transition: background .2s, border-color .2s;
  }
  .relay-row.on { background: var(--green-dim); border-color: var(--green-border); }
  .relay-row.loading { background: rgba(57,197,245,.03); border-color: var(--border); opacity: .7; }

  .relay-num { font-size: 10px; color: var(--text-dim); width: 26px; flex-shrink: 0; letter-spacing: .05em; }
  .relay-indicator {
    width: 6px; height: 28px; border-radius: 3px;
    background: #2a2a2a; flex-shrink: 0; transition: background .2s, box-shadow .2s;
  }
  .relay-row.on .relay-indicator { background: var(--green); box-shadow: 0 0 8px rgba(0,230,118,.5); }
  .relay-row.loading .relay-indicator { background: var(--accent); box-shadow: 0 0 8px rgba(57,197,245,.5); }

  .relay-desc {
    flex: 1; font-size: 13px; color: #8a9da8;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: color .2s;
  }
  .relay-row.on .relay-desc { color: var(--green); }

  .toggle-btn {
    padding: 5px 18px; font-size: 11px; font-family: var(--font); font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase; border-radius: 3px;
    border: 1px solid var(--red); background: rgba(255,61,61,.1); color: var(--red);
    cursor: pointer; outline: none; min-width: 48px; transition: all .15s; flex-shrink: 0;
  }
  .relay-row.on .toggle-btn { border-color: var(--green); background: rgba(0,230,118,.12); color: var(--green); }
  .relay-row.loading .toggle-btn { border-color: var(--accent); background: rgba(57,197,245,.08); color: var(--accent); cursor: wait; }

  .error-banner {
    display: none; font-size: 10px; color: var(--red); letter-spacing: .06em;
    background: var(--red-dim); border: 1px solid var(--red-border);
    padding: 5px 12px; border-radius: 3px; margin-top: 4px;
  }
  .error-banner.show { display: block; }

  /* Footer */
  .footer {
    margin-top: 20px; border-top: 1px solid var(--border); padding-top: 10px;
    display: flex; justify-content: space-between;
    font-size: 10px; color: #2a3d4d; letter-spacing: .08em;
  }

  /* Settings */
  .setting-block {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 4px; padding: 14px 16px; margin-bottom: 8px;
  }
  .setting-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .setting-row:last-child { margin-bottom: 0; }
  .s-label { font-size: 11px; color: var(--text-dim); letter-spacing: .08em; width: 140px; flex-shrink: 0; }

  input[type=text], input[type=number] {
    background: var(--bg); border: 1px solid var(--border); border-radius: 3px;
    color: var(--text); font-family: var(--font); font-size: 12px;
    padding: 5px 10px; outline: none; transition: border-color .15s;
  }
  input[type=text]:focus, input[type=number]:focus { border-color: var(--accent); }
  input[type=text] { flex: 1; min-width: 60px; }
  input[type=number] { width: 64px; text-align: center; }

  .save-btn {
    padding: 5px 14px; font-size: 11px; font-family: var(--font); font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase;
    border: 1px solid var(--accent); border-radius: 3px;
    background: rgba(57,197,245,.08); color: var(--accent);
    cursor: pointer; outline: none; transition: background .15s;
  }
  .save-btn:hover { background: rgba(57,197,245,.16); }

  .desc-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .desc-row:last-child { margin-bottom: 0; }
  .d-label { font-size: 11px; color: var(--text-dim); width: 40px; flex-shrink: 0; }
  .desc-row input { flex: 1; }

  .save-row { text-align: right; margin-top: 10px; }

  /* Toast */
  #toast {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%) translateY(12px);
    opacity: 0; background: var(--bg2); border: 1px solid var(--accent);
    color: var(--accent); font-family: var(--font); font-size: 11px;
    letter-spacing: .1em; padding: 7px 20px; border-radius: 3px;
    pointer-events: none; transition: all .22s; white-space: nowrap; z-index: 999;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <svg width="26" height="26" viewBox="0 0 30 30" fill="none">
        <circle cx="15" cy="15" r="14" stroke="#1e2d3d" stroke-width="1.5"/>
        <polygon points="17,4 8,17 15,17 13,26 22,13 15,13" fill="#39c5f5" opacity=".85"/>
      </svg>
    </div>
    <div>
      <div class="header-title">Remote Switch</div>
      <div class="header-sub" id="hdr-ip">niet ingesteld</div>
    </div>
    <div class="status">
      <div class="status-dot" id="status-dot"></div>
      <span class="status-label" id="status-label">GEREED</span>
      <button class="sync-btn" id="sync-btn" onclick="syncFromBoard()" title="Lees status van board">⟳</button>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('relays')">Relays</button>
    <button class="tab-btn" onclick="switchTab('settings')">Settings</button>
  </div>

  <!-- Relays panel -->
  <div class="panel active" id="panel-relays">
    <div class="section-label" id="relay-count-label">Relay Control — 4 channels</div>
    <div id="relay-list"></div>
    <div class="footer">
      <span>BOLT-SDR REMOTE v2.0</span>
      <span id="active-count">0/4 ACTIVE</span>
    </div>
  </div>

  <!-- Settings panel -->
  <div class="panel" id="panel-settings">

    <div class="section-label">Network</div>
    <div class="setting-block">
      <div class="setting-row">
        <span class="s-label">IP Address</span>
        <input type="text" id="input-ip" value="" placeholder="Vul relay board IP in" spellcheck="false" style="border-color: var(--red);" oninput="this.style.borderColor=this.value?'var(--border)':' var(--red)'">
        <button class="save-btn" onclick="saveIp()">Save</button>
      </div>
    </div>

    <div class="section-label">Channels</div>
    <div class="setting-block">
      <div class="setting-row">
        <span class="s-label">Aantal relays</span>
        <input type="number" id="input-count" value="4" min="1" max="10">
        <button class="save-btn" onclick="applyCount()">Apply</button>
      </div>
    </div>

    <div class="section-label">Channel Labels</div>
    <div class="setting-block">
      <div id="desc-list"></div>
      <div class="save-row">
        <button class="save-btn" onclick="saveDescriptions()">Save Labels</button>
      </div>
    </div>

  </div>
</div>

<div id="toast"></div>

<script>
// ── State ─────────────────────────────────────────────────────
const STORAGE_KEY = 'remote-switch-v2';

function defaultState() {
  return {
    ip: '',
    buttons: [
      { id: 1, desc: 'Button 1', state: false },
      { id: 2, desc: 'Button 2', state: false },
      { id: 3, desc: 'Button 3', state: false },
      { id: 4, desc: 'Button 4', state: false },
    ]
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return defaultState();
}

function persist() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

let state = loadState();
let loading = {}; // relay id -> bool

// ── Tabs ──────────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', ['relays','settings'][i] === name);
  });
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  if (name === 'settings') renderDescInputs();
}

// ── Relay list ────────────────────────────────────────────────
function renderRelays() {
  const list = document.getElementById('relay-list');
  list.innerHTML = '';
  document.getElementById('relay-count-label').textContent =
    `Relay Control — ${state.buttons.length} channels`;

  state.buttons.forEach(btn => {
    const isOn = btn.state;
    const isLoading = !!loading[btn.id];

    const row = document.createElement('div');
    row.className = 'relay-row' + (isLoading ? ' loading' : isOn ? ' on' : '');
    row.id = 'row-' + btn.id;

    row.innerHTML = `
      <span class="relay-num">R${String(btn.id).padStart(2,'0')}</span>
      <div class="relay-indicator"></div>
      <span class="relay-desc">${escHtml(btn.desc)}</span>
      <button class="toggle-btn" onclick="toggleRelay(${btn.id})" ${isLoading ? 'disabled' : ''}>
        ${isLoading ? '···' : isOn ? 'ON' : 'OFF'}
      </button>
    `;

    const errDiv = document.createElement('div');
    errDiv.className = 'error-banner';
    errDiv.id = 'err-' + btn.id;

    list.appendChild(row);
    list.appendChild(errDiv);
  });

  updateActiveCount();
}

function updateActiveCount() {
  const active = state.buttons.filter(b => b.state).length;
  document.getElementById('active-count').textContent =
    `${active}/${state.buttons.length} ACTIVE`;
}

// ── Toggle relay ──────────────────────────────────────────────
async function toggleRelay(id) {
  if (loading[id]) return;
  const btn = state.buttons.find(b => b.id === id);
  if (!btn) return;

  loading[id] = true;
  renderRelays();
  clearError(id);

  const relayIndex = id - 1;
  // on=1 zet aan, on=0 zet uit — geen toggle maar expliciete staat
  const desiredOn = !btn.state ? 1 : 0;
  const url = `/relay/${state.ip}/relay_cgi.cgi?type=4&relay=${relayIndex}&on=${desiredOn}&time=0&pwd=0&`;

  try {
    const res = await fetch(url, { signal: AbortSignal.timeout(3000) });
    const text = await res.text();
    // Response bevat &0&4&<relay>&<staat>&0& — lees staat uit positie 4
    btn.state = text.includes(`&0&4&${relayIndex}&1&0&`);
  } catch(e) {
    showError(id, 'Verbinding mislukt: ' + e.message);
    // Toggle lokaal als fallback zodat de UI toch reageert
    btn.state = !btn.state;
  }

  loading[id] = false;
  persist();
  renderRelays();
}

function showError(id, msg) {
  const el = document.getElementById('err-' + id);
  if (el) { el.textContent = msg; el.classList.add('show'); }
}
function clearError(id) {
  const el = document.getElementById('err-' + id);
  if (el) el.classList.remove('show');
}

// ── Settings: IP ──────────────────────────────────────────────
function saveIp() {
  const val = document.getElementById('input-ip').value.trim();
  if (!/^(\d{1,3}\.){3}\d{1,3}$/.test(val)) { showToast('Ongeldig IP-adres'); return; }
  state.ip = val;
  const hdrIp = document.getElementById('hdr-ip');
  hdrIp.textContent = val;
  hdrIp.style.color = '';
  persist();
  showToast('IP opgeslagen');
  switchTab('buttons');
  syncFromBoard();
}

// ── Settings: relay count ─────────────────────────────────────
function applyCount() {
  const n = Math.max(1, Math.min(10, parseInt(document.getElementById('input-count').value) || 1));
  while (state.buttons.length < n) {
    const newId = state.buttons.length + 1;
    state.buttons.push({ id: newId, desc: 'Button ' + newId, state: false });
  }
  state.buttons = state.buttons.slice(0, n);
  persist();
  renderRelays();
  renderDescInputs();
  showToast(`${n} relays ingesteld`);
}

// ── Settings: descriptions ────────────────────────────────────
function renderDescInputs() {
  const list = document.getElementById('desc-list');
  list.innerHTML = '';
  state.buttons.forEach(btn => {
    const row = document.createElement('div');
    row.className = 'desc-row';
    row.innerHTML = `
      <span class="d-label">R${String(btn.id).padStart(2,'0')}</span>
      <input type="text" id="desc-input-${btn.id}" value="${escHtml(btn.desc)}">
    `;
    list.appendChild(row);
  });
}

function saveDescriptions() {
  state.buttons.forEach(btn => {
    const el = document.getElementById('desc-input-' + btn.id);
    if (el) btn.desc = el.value.trim() || btn.desc;
  });
  persist();
  renderRelays();
  showToast('Labels opgeslagen');
}

// ── Toast ─────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// ── Util ──────────────────────────────────────────────────────
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Service Worker registratie ────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// ── Sync: lees werkelijke status via relay_cgi_load.cgi ──────
// Response formaat: &0&<count>&<on0>&<on1>&<on2>&...
// on=0 = UIT, on=1 = AAN
async function syncFromBoard(silent = false) {
  const btn = document.getElementById('sync-btn');
  const dot = document.getElementById('status-dot');
  const lbl = document.getElementById('status-label');
  if (!silent) {
    btn.classList.add('spinning');
    btn.disabled = true;
  }
  try {
    const url = `/relay/${state.ip}/relay_cgi_load.cgi?`;
    const res = await fetch(url, { signal: AbortSignal.timeout(3000) });
    const text = await res.text();
    // &0&<err>&<count>&<on0>&<on1>&...
    const parts = text.split('&');
    const err = parseInt(parts[1]);
    if (err !== 0) throw new Error('Board error: ' + err);
    const count = parseInt(parts[2]);
    state.buttons.forEach((b, i) => {
      if (i < count) {
        b.state = (parseInt(parts[3 + i]) === 1);
      }
    });
    persist();
    dot.classList.remove('off');
    lbl.classList.remove('off');
    lbl.textContent = 'ONLINE';
    if (!silent) showToast('Status gelezen van board');
  } catch(e) {
    dot.classList.add('off');
    lbl.classList.add('off');
    lbl.textContent = 'OFFLINE';
    if (!silent) showToast('Board niet bereikbaar');
  }
  // Laad-indicatoren altijd uitzetten na sync
  state.buttons.forEach(b => { loading[b.id] = false; });
  if (!silent) {
    btn.classList.remove('spinning');
    btn.disabled = false;
  }
  renderRelays();
}

// ── Ping: check of board bereikbaar is ───────────────────────
async function checkOnline() {
  const dot = document.getElementById('status-dot');
  const lbl = document.getElementById('status-label');
  try {
    await fetch(`/relay/${state.ip}/relay_cgi.cgi?type=0&pwd=0&`, {
      signal: AbortSignal.timeout(3000),
    });
    dot.classList.remove('off');
    lbl.classList.remove('off');
    lbl.textContent = 'ONLINE';
  } catch(e) {
    dot.classList.add('off');
    lbl.classList.add('off');
    lbl.textContent = 'OFFLINE';
  }
}

// ── Init ──────────────────────────────────────────────────────
document.getElementById('input-ip').value = state.ip;
const hdrIp = document.getElementById('hdr-ip');
hdrIp.textContent = state.ip || '⚠ IP niet ingesteld';
hdrIp.style.color = state.ip ? '' : 'var(--red)';
if (!state.ip) {
  document.getElementById('input-ip').style.borderColor = 'var(--red)';
}
document.getElementById('input-count').value = state.buttons.length;
// Als er nog geen IP is, ga direct naar settings
if (!state.ip) {
  renderRelays();
  switchTab('settings');
  showToast('Vul eerst het relay board IP in');
} else {
  // Zet alle knoppen op 'laden' totdat sync klaar is
  state.buttons.forEach(b => { loading[b.id] = true; });
  renderRelays();
  syncFromBoard();
}
// Poll status elke 5 seconden van het board
setInterval(() => { if (state.ip) syncFromBoard(true); }, 5000);
</script>
</body>
</html>
