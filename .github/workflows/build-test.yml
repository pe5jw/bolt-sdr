name: Build and Test

on:
  push:
    branches: [bolt-main, main, develop]
  pull_request:
    branches: [bolt-main, main, develop]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            arch: x64
          - name: windows-x64
            os: windows-latest
            arch: x64
          - name: macos-arm64
            os: macos-latest
            arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bolt-web/package-lock.json

      - name: Restore .NET dependencies
        run: dotnet restore Bolt.slnx

      - name: Build .NET solution
        run: dotnet build Bolt.slnx --configuration Release --no-restore

      - name: Install frontend dependencies
        run: npm ci
        working-directory: bolt-web

      - name: Build frontend
        run: npm run build
        working-directory: bolt-web

      - name: Verify frontend output
        shell: bash
        run: |
          if [ ! -f "bolt-web/dist/index.html" ]; then
            echo "Error: Frontend build did not produce bolt-web/dist/index.html"
            exit 1
          fi
          echo "Frontend build successful"
