[bridge]
; CAT poort voor N1MM+ (Kenwood TS-2000)
cat_port = 4532

; Winkeyer emulatie poort voor N1MM+ (CW + RTTY TX)
wk_port = 5597

; TCI WebSocket URL van Bolt SDR
tci_url = ws://localhost:40001

; TCI receiver nummer (0 = eerste)
tci_receiver = 0

; DVK map (leeg = automatisch %LOCALAPPDATA%\Bolt\dvk)
dvk_dir =

; Standaard CW snelheid in WPM (N1MM overschrijft dit via Winkeyer protocol)
cw_speed = 25

[logging]
; DEBUG, INFO, WARNING, ERROR
level = INFO
